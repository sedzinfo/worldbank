name: Build package tarball

# Runs only from the Actions tab ("Run workflow"): each run downloads about 300 MB of data from Git LFS,
# and the tarball (about 110 MB) is too large to commit, so it is attached to the run as a download instead
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-tarball
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the package data (data/) is stored in Git LFS; fetch only that
      - name: Fetch package data from LFS
        run: git lfs pull --include="data/*"

      - uses: r-lib/actions/setup-r@v2

      - name: Build tarball
        run: |
          rm -f worldbank_*.tar.gz         # drop the old build (also an old version number)
          R CMD build . --resave-data --no-build-vignettes --no-manual

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages for the R manual
        run: tlmgr install inconsolata upquote makeindex

      - name: Build PDF manual
        run: R CMD Rd2pdf . --force --no-preview --output=worldbank.pdf

      # download from the run's page (Artifacts); kept for 30 days
      - uses: actions/upload-artifact@v4
        with:
          name: worldbank-tarball-and-manual
          path: |
            worldbank_*.tar.gz
            worldbank.pdf
          retention-days: 30

