name: Build package tarball

on:
  push:
    branches: [ "main" ]
    paths:                                        # only when the package itself changes
      - "R/**"
      - "man/**"
      - "data/**"
      - "inst/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "LICENSE"
      - ".Rbuildignore"
      - ".github/workflows/build-tarball.yml"
  workflow_dispatch:                              # also allows a manual run from the Actions tab

permissions:
  contents: write                                 # needed to commit the tarball back

concurrency:
  group: build-tarball
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the package data (data/) is stored in Git LFS; fetch only that
      - name: Fetch package data from LFS
        run: git lfs pull --include="data/*"

      - uses: r-lib/actions/setup-r@v2

      - name: Build tarball
        run: |
          rm -f worldbank_*.tar.gz         # drop the old build (also an old version number)
          R CMD build . --resave-data --no-build-vignettes --no-manual

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages for the R manual
        run: tlmgr install inconsolata upquote makeindex

      - name: Build PDF manual
        run: R CMD Rd2pdf . --force --no-preview --output=worldbank.pdf

      - name: Commit tarball and manual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "worldbank_*.tar.gz" worldbank.pdf
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild package tarball and manual [skip ci]"
          git pull --rebase
          git push
